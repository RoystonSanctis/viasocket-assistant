name: Config

# Validates config/ and publishes it to the branch the extension downloads from:
#   main  -> config-stable   (everyone)
#   beta  -> config-beta     (users who pick the Beta channel)
# The published branches hold only the config files at their root and are regenerated on every publish,
# so never edit them by hand.

on:
  push:
    branches: [main, beta]
    paths: ['config/**', '.github/workflows/config.yml']
  pull_request:
    paths: ['config/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: config
    steps:
      - uses: actions/checkout@v4
        with:
          # The configVersion check compares against the previous commit.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: config/package-lock.json
      - run: npm ci
      - run: node scripts/validate.mjs

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'beta')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-config-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish config/ to its channel branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then target=config-stable; else target=config-beta; fi
          out="$(mktemp -d)"
          cp -R config/. "$out"/
          rm -rf "$out/node_modules"
          cd "$out"
          git init -q -b "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish config from ${GITHUB_SHA::7}"
          git push --force -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"
          echo "Published to $target"
