name: Extension

on:
  push:
    paths: ['extension/**', 'config/**', '.github/workflows/extension.yml']
  pull_request:
    paths: ['extension/**', 'config/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Validates the bundled config/ against the extension's own schemas and tool list.
      - run: npm run check-config
      # Download from the run page, unzip, then Load unpacked in chrome://extensions.
      - uses: actions/upload-artifact@v4
        with:
          name: viasocket-assistant-dist
          path: extension/dist
          retention-days: 14
