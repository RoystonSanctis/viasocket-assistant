name: Extension

on:
  push:
    paths: ['extension/**', 'config/**', '.github/workflows/extension.yml']
  pull_request:
    paths: ['extension/**', 'config/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Validates the bundled config/ against the extension's own schemas and tool list.
      - run: npm run check-config
      # Packages the extension into a Chrome Web Store compliant ZIP archive.
      - run: npm run package
      # The zip is named after package.json's version; read it so a version bump never breaks the upload.
      - run: echo "EXT_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: viasocket-assistant-${{ env.EXT_VERSION }}-webstore-package
          path: extension/viasocket-assistant-${{ env.EXT_VERSION }}.zip
          if-no-files-found: error
          retention-days: 14
      # Download unpacked dist for local developer loading in chrome://extensions.
      - uses: actions/upload-artifact@v4
        with:
          name: viasocket-assistant-dist
          path: extension/dist
          retention-days: 14
